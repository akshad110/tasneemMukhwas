# Render Blueprint — Tasneem Mukhwas
services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: tasneemmukhwas-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://tasneemmukhwas.onrender.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Tasneem Mukhwas <info@tasneemmukhwas.com>

  # ── Frontend (static) ────────────────────────────────────────
  - type: web
    name: tasneemmukhwas
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tasneemmukhwas-api.onrender.com/api
